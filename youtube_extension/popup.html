<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dynamic Island YouTube</title>
    <style>
      * { box-sizing: border-box; }
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        color: #f4f4f5;
        background: #09090b;
        font: 13px "Segoe UI", sans-serif;
      }
      .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
      .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 1px solid #3f3f46;
        border-radius: 11px;
        background: #18181b;
        color: #a7f3d0;
        font-size: 15px;
        font-weight: 700;
      }
      h1 { margin: 0; font-size: 14px; line-height: 1.25; }
      .subtitle { margin: 3px 0 0; color: #a1a1aa; font-size: 11px; }
      .connection-card {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        min-height: 66px;
        padding: 12px;
        border: 1px solid #3f3f46;
        border-radius: 12px;
        background: #18181b;
      }
      .status-dot {
        flex: 0 0 auto;
        width: 9px;
        height: 9px;
        margin-top: 4px;
        border-radius: 50%;
        background: #71717a;
        box-shadow: 0 0 0 3px #3f3f46;
      }
      .connection-copy { min-width: 0; }
      .status-title { display: block; font-size: 12px; line-height: 1.35; }
      #status { margin: 3px 0 0; color: #a1a1aa; font-size: 11px; line-height: 1.4; }
      .connection-card[data-state="connected"] {
        border-color: #166534;
        background: linear-gradient(135deg, #10251d, #18181b 72%);
      }
      .connection-card[data-state="connected"] .status-dot {
        background: #34d399;
        box-shadow: 0 0 0 3px #064e3b, 0 0 12px #34d39966;
      }
      .connection-card[data-state="connected"] #status { color: #a7f3d0; }
      .connection-card[data-state="disconnected"] { border-color: #52525b; }
      .connection-card[data-state="disconnected"] .status-dot {
        background: #f87171;
        box-shadow: 0 0 0 3px #7f1d1d;
      }
      .actions { margin-top: 12px; }
      button {
        width: 100%;
        min-height: 38px;
        padding: 9px 12px;
        border: 0;
        border-radius: 9px;
        color: #09090b;
        background: #a7f3d0;
        font: 600 13px "Segoe UI", sans-serif;
        cursor: pointer;
      }
      button:hover { background: #86efac; }
      button:disabled { cursor: wait; opacity: .72; }
      button:focus-visible { outline: 2px solid white; outline-offset: 2px; }
      .hint { margin: 11px 1px 0; color: #71717a; font-size: 10px; line-height: 1.45; }
    </style>
  </head>
  <body>
    <header class="brand">
      <div class="brand-mark" aria-hidden="true">D</div>
      <div>
        <h1>Dynamic Island</h1>
        <p class="subtitle">Integrasi YouTube</p>
      </div>
    </header>
    <section id="connection-card" class="connection-card" data-state="checking" role="status" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <div class="connection-copy">
        <strong id="status-title" class="status-title">Memeriksa koneksi…</strong>
        <p id="status">Menghubungi aplikasi Dynamic Island.</p>
      </div>
    </section>
    <div class="actions">
      <button id="connect" type="button">Periksa koneksi</button>
    </div>
    <p class="hint">Saat ikon ekstensi menampilkan ON, aplikasi siap. Buka YouTube untuk memakai tombol Skip iklan.</p>
    <script src="popup.js"></script>
  </body>
</html>
